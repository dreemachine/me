function getCountry(city) {
  var c = city.toLowerCase();
  if (/vietnam|viet|bac lieu|mien trung|saigon|ho chi minh/.test(c)) return 'Vietnam';
  if (/china|beijing|shanghai|shandong|hebei|jiangxi|tianjin|shenyang|hangzhou|ningbo|huainan|chaoyang|beilun/.test(c)) return 'China';
  if (/korea|seoul/.test(c)) return 'Korea';
  if (/japan|tokyo|sendai|ishinomaki/.test(c)) return 'Japan';
  if (/taiwan|taipei|chiayi/.test(c)) return 'Taiwan';
  if (/hong kong/.test(c)) return 'Hong Kong';
  if (/india|bihar|ahmedabad|sajiyavadar/.test(c)) return 'India';
  if (/mexico|oaxaca|guanajuato|toluca|manuel doblado/.test(c)) return 'Mexico';
  if (/guatemala/.test(c)) return 'Guatemala';
  if (/puerto rico|a\u00f1asco/.test(c)) return 'Puerto Rico';
  if (/nigeria|imo|aba/.test(c)) return 'Nigeria';
  if (/zambia|lusaka/.test(c)) return 'Zambia';
  if (/mozambique|maputo|quelimane/.test(c)) return 'Mozambique';
  if (/armenia|ejmiatsin|armavir/.test(c)) return 'Armenia';
  if (/norway|oslo/.test(c)) return 'Norway';
  if (/germany|munich/.test(c)) return 'Germany';
  if (/hawaii|honolulu|oahu/.test(c)) return 'Hawaii / USA';
  return 'North America';
}

  'Vietnam':'#e05c3a','China':'#c9395e','Korea':'#a855b5','Japan':'#7c3aed',
  'Taiwan':'#4f6ddb','Hong Kong':'#2563b8','India':'#0891b2','Mexico':'#059669',
  'Guatemala':'#65a30d','Puerto Rico':'#ca8a04','Nigeria':'#d97706','Zambia':'#dc4f1a',
  'Mozambique':'#be185d','Armenia':'#7e22ce','Norway':'#1d6fb5','Germany':'#94a3b8',
  'Hawaii / USA':'#0d9488','North America':'#6b7280'
};

function initGlobe() {
  var wrap = document.getElementById('globe-wrap');
  var W = wrap.clientWidth;
  var H = wrap.clientHeight;
  var R = Math.min(W, H) * 0.42;
  var svg = d3.select('#globe').attr('width', W).attr('height', H);
  var tooltip = document.getElementById('tooltip');

  var projection = d3.geoOrthographic()
    .scale(R)
    .translate([W/2, H/2])
    .clipAngle(90)
    .rotate([100, -30]); // start centered on Pacific

  var path = d3.geoPath().projection(projection);

  // Globe base layers
  var defs = svg.append('defs');
  var grad = defs.append('radialGradient').attr('id','globe-grad')
    .attr('cx','35%').attr('cy','35%');
  grad.append('stop').attr('offset','0%').attr('stop-color','#1e1e30');
  grad.append('stop').attr('offset','100%').attr('stop-color','#0a0a14');

  svg.append('circle').attr('cx',W/2).attr('cy',H/2).attr('r',R)
    .attr('fill','url(#globe-grad)').attr('stroke','#2a2a40').attr('stroke-width',0.5);

  var gGraticule = svg.append('g');
  var gLand      = svg.append('g');
  var gLines     = svg.append('g');
  var gDots      = svg.append('g');

  // Graticule
  gGraticule.append('path').datum(d3.geoGraticule()())
    .attr('fill','none').attr('stroke','#1e1e30').attr('stroke-width',0.4);

  // Load land
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json').then(function(world) {
    var land = topojson_feature(world, world.objects.land);
    gLand.append('path').datum(land)
      .attr('fill','#1e2235').attr('stroke','#2d3050').attr('stroke-width',0.4);
    redraw();
  }).catch(function() {
    // fallback if topojson not available — just redraw dots/lines
    redraw();
  });

  // Build arc data
  var arcData = [];
  var countryArcs = {};
  var studentArcs = {};

  STUDENTS.forEach(function(s) {
    if (s.lat == null || s.lng == null) return;
    studentArcs[s.name] = [];
    var drawn = {};
    s.caretakers.forEach(function(c) {
      if (!c.lat || !c.lng) return;
      var ck = c.lat.toFixed(3)+','+c.lng.toFixed(3);
      if (drawn[ck]) return;
      drawn[ck] = true;
      var country = getCountry(c.city);
      var color = COUNTRY_COLORS[country] || '#6b7280';
      var arc = {
        type: 'LineString',
        coordinates: [[s.lng, s.lat],[c.lng, c.lat]],
        color: color,
        country: country,
        studentName: s.name,
        caretakerCity: c.city
      };
      arcData.push(arc);
      studentArcs[s.name].push(arc);
      if (!countryArcs[country]) countryArcs[country] = [];
      countryArcs[country].push(arc);
    });
  });

  // Draw arcs
  var arcPaths = gLines.selectAll('path.arc').data(arcData).enter()
    .append('path').attr('class','arc')
    .attr('fill','none')
    .attr('stroke', function(d){ return d.color; })
    .attr('stroke-width', 1)
    .attr('stroke-opacity', 0.12)
    .attr('d', path);

  // Draw dots
  var dotData = [];
  STUDENTS.forEach(function(s) {
    if (s.lat == null || s.lng == null) return;
    // avoid dupes
    var k = s.lat.toFixed(3)+','+s.lng.toFixed(3);
    if (!dotData._seen) dotData._seen = {};
    if (!dotData._seen[k]) {
      dotData._seen[k] = true;
      var names = STUDENTS.filter(function(x){ return x.lat === s.lat && x.lng === s.lng; }).map(function(x){ return x.name; });
      dotData.push({ lat: s.lat, lng: s.lng, names: names, type: 'student' });
    }
    s.caretakers.forEach(function(c) {
      if (!c.lat || !c.lng) return;
      var ck = c.lat.toFixed(3)+','+c.lng.toFixed(3);
      if (!dotData._seen[ck]) {
        dotData._seen[ck] = true;
        var country = getCountry(c.city);
        dotData.push({ lat: c.lat, lng: c.lng, city: c.city, country: country, type: 'caretaker' });
      }
    });
  });

  var dots = gDots.selectAll('circle').data(dotData).enter()
    .append('circle')
    .attr('r', function(d){ return d.type === 'student' ? 4 : 3; })
    .attr('fill', function(d){ return d.type === 'student' ? '#7c6fcd' : (COUNTRY_COLORS[d.country] || '#6b7280'); })
    .attr('stroke', '#0e0e12').attr('stroke-width', 1)
    .attr('opacity', 0.9)
    .style('cursor','pointer')
    .on('mousemove', function(event, d) {
      var label = d.type === 'student' ? d.names.join(', ') : d.city;
      tooltip.style.display = 'block';
      tooltip.style.left = (event.offsetX + 12) + 'px';
      tooltip.style.top  = (event.offsetY - 8)  + 'px';
      tooltip.textContent = label;
    })
    .on('mouseleave', function() { tooltip.style.display = 'none'; });

  function redraw() {
    gGraticule.select('path').attr('d', path);
    gLand.select('path').attr('d', path);
    arcPaths.attr('d', path);
    dots.attr('cx', function(d) {
      var p = projection([d.lng, d.lat]);
      return p ? p[0] : -9999;
    }).attr('cy', function(d) {
      var p = projection([d.lng, d.lat]);
      return p ? p[1] : -9999;
    }).attr('opacity', function(d) {
      var p = projection([d.lng, d.lat]);
      return p ? 0.9 : 0;
    });
  }

  // Drag to rotate
  var dragStart;
  svg.call(d3.drag()
    .on('start', function(event) {
      dragStart = { x: event.x, y: event.y, rotate: projection.rotate().slice() };
    })
    .on('drag', function(event) {
      var dx = event.x - dragStart.x;
      var dy = event.y - dragStart.y;
      var r = dragStart.rotate;
      projection.rotate([r[0] + dx * 0.3, r[1] - dy * 0.3, r[2]]);
      redraw();
    })
  );

  // Scroll to zoom
  svg.on('wheel', function(event) {
    event.preventDefault();
    var s = projection.scale();
    projection.scale(Math.max(50, Math.min(1200, s - event.deltaY * 0.5)));
    redraw();
  });

  // State
  var activeStudent = null;
  var activeCountry = null;

  function clearAll() {
    activeStudent = null;
    activeCountry = null;
    arcPaths.attr('stroke-opacity', 0.12).attr('stroke-width', 1);
    document.querySelectorAll('.s-item').forEach(function(e){ e.classList.remove('active'); });
    document.querySelectorAll('.leg-row').forEach(function(e){ e.classList.remove('active'); });
  }

  function highlightArcs(filterFn) {
    arcPaths
      .attr('stroke-opacity', function(d){ return filterFn(d) ? 0.85 : 0.04; })
      .attr('stroke-width',   function(d){ return filterFn(d) ? 2.5  : 0.8; });
  }

  // Sidebar
  var list = document.getElementById('student-list');
  STUDENTS.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).forEach(function(s) {
    var el = document.createElement('div');
    el.className = 's-item';
    el.textContent = s.name;
    el.dataset.name = s.name;
    el.addEventListener('click', function() {
      if (activeStudent === s.name) {
        clearAll();
      } else {
        clearAll();
        activeStudent = s.name;
        el.classList.add('active');
        highlightArcs(function(d){ return d.studentName === s.name; });
        if (s.lat != null) {
          var r = projection.rotate();
          // rotate to student
          d3.transition().duration(800).tween('rotate', function() {
            var ri = d3.interpolate(r, [-s.lng, -s.lat, 0]);
            return function(t) { projection.rotate(ri(t)); redraw(); };
          });
        }
      }
    });
    list.appendChild(el);
  });

  // Legend
  var legendRows = document.getElementById('legend-rows');
  Object.keys(COUNTRY_COLORS).forEach(function(country) {
    if (!countryArcs[country]) return;
    var color = COUNTRY_COLORS[country];
    var row = document.createElement('div');
    row.className = 'leg-row';
    row.innerHTML = '<div class="leg-swatch" style="background:'+color+';"></div>'+country;
    row.addEventListener('click', function() {
      if (activeCountry === country) {
        clearAll();
      } else {
        clearAll();
        activeCountry = country;
        row.classList.add('active');
        highlightArcs(function(d){ return d.country === country; });
      }
    });
    legendRows.appendChild(row);
  });
}

// Minimal topojson feature extractor (avoid external dependency)
function topojson_feature(topology, o) {
  return { type: 'FeatureCollection', features: o.geometries.map(function(g) {
    return { type: 'Feature', geometry: topojson_geometry(topology, g), properties: {} };
  })};
}
function topojson_geometry(topology, o) {
  var arcs = topology.arcs;
  function arc(i, p) {
    if (i < 0) { var a = arcs[~i].slice().reverse(); } else { var a = arcs[i]; }
    a.forEach(function(pt, j) {
      if (j) { p[p.length-1][0] += pt[0]; p[p.length-1][1] += pt[1]; }
      else p.push([pt[0], pt[1]]);
    });
  }
  function rings(arcs_list) {
    return arcs_list.map(function(ring) {
      var p = []; ring.forEach(function(i){ arc(i,p); }); return p;
    });
  }
  var scale = topology.transform ? topology.transform.scale : [1,1];
  var translate = topology.transform ? topology.transform.translate : [0,0];
  function decode(coords) {
    var x=0,y=0;
    return coords.map(function(p){ x+=p[0]; y+=p[1]; return [(x*scale[0]+translate[0]), (y*scale[1]+translate[1])]; });
  }
  arcs = arcs.map(decode);
  if (o.type === 'Polygon') return { type:'Polygon', coordinates: rings(o.arcs) };
  if (o.type === 'MultiPolygon') return { type:'MultiPolygon', coordinates: o.arcs.map(rings) };
  if (o.type === 'GeometryCollection') return { type:'GeometryCollection', geometries: o.geometries.map(function(g){ return topojson_geometry(topology,g); }) };
  return { type: o.type, coordinates: [] };
}
