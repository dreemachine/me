<style>
  #saudade-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 1rem;
  }

  #book {
    width: 500px;
    height: 500px;
  }

  #book .page img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .saudade-controls {
    display: flex;
    gap: 16px;
    margin-top: 24px;
    align-items: center;
  }

  .saudade-controls button {
    background: none;
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.5);
    padding: 8px 20px;
    font-family: Georgia, serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
  }

  .saudade-controls button:hover {
    border-color: rgba(255,255,255,0.5);
    color: rgba(255,255,255,0.9);
  }

  #page-num {
    color: rgba(255,255,255,0.3);
    font-size: 12px;
    letter-spacing: 0.15em;
    min-width: 60px;
    text-align: center;
  }

  @media (max-width: 560px) {
    #book {
      width: 320px;
      height: 320px;
    }
  }
</style>

<div id="saudade-wrap">

  <div id="book">
    <div class="page"><img src="/assets/saudade/page01.jpg" alt="Page 1"></div>
    <div class="page"><img src="/assets/saudade/page02.jpg" alt="Page 2"></div>
    <div class="page"><img src="/assets/saudade/page03.jpg" alt="Page 3"></div>
    <div class="page"><img src="/assets/saudade/page04.jpg" alt="Page 4"></div>
    <div class="page"><img src="/assets/saudade/page05.jpg" alt="Page 5"></div>
    <div class="page"><img src="/assets/saudade/page06.jpg" alt="Page 6"></div>
  </div>

  <div class="saudade-controls">
    <button id="prev">&#8592; prev</button>
    <span id="page-num">1 / 6</span>
    <button id="next">next &#8594;</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
<script>
  const pageFlip = new St.PageFlip(document.getElementById('book'), {
    width: 500,
    height: 500,
    size: 'fixed',
    minWidth: 320,
    maxWidth: 600,
    minHeight: 320,
    maxHeight: 600,
    showCover: true,
    drawShadow: true,
    flippingTime: 800,
    usePortrait: true,
    startZIndex: 0,
    autoSize: false,
    maxShadowOpacity: 0.4,
    mobileScrollSupport: true,
  });

  pageFlip.loadFromHTML(document.querySelectorAll('#book .page'));

  pageFlip.on('flip', (e) => {
    document.getElementById('page-num').textContent = `${e.data + 1} / 6`;
  });

  document.getElementById('prev').addEventListener('click', () => pageFlip.flipPrev());
  document.getElementById('next').addEventListener('click', () => pageFlip.flipNext());
</script>
