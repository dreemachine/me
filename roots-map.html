<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f7f4; }
  #header { padding: 18px 24px 14px; background: white; border-bottom: 0.5px solid #d3d1c7; }
  #header h1 { font-size: 18px; font-weight: 500; color: #2C2C2A; }
  #header p { font-size: 13px; color: #888780; margin-top: 2px; }
  #map { height: calc(100vh - 110px); width: 100%; }
  #legend {
    position: absolute; bottom: 28px; left: 16px; z-index: 1000;
    background: white; border: 0.5px solid #d3d1c7; border-radius: 10px;
    padding: 10px 14px; display: flex; flex-direction: column; gap: 7px;
  }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5F5E5A; }
  .leaflet-tooltip.rt {
    background: white; border: 0.5px solid #d3d1c7; border-radius: 6px;
    padding: 5px 10px; font-size: 12px; color: #2C2C2A; line-height: 1.6;
    box-shadow: none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .leaflet-tooltip.rt::before { display: none; }
  .rt-name { font-weight: 500; display: block; }
  .rt-city { color: #888780; font-size: 11px; display: block; }
  .rt-divider { border: none; border-top: 0.5px solid #d3d1c7; margin: 3px 0; }
</style>
</head>
<body>

<div id="gate" style="position:fixed;inset:0;background:#f8f7f4;z-index:9999;display:flex;align-items:center;justify-content:center;">
  <div style="background:white;border:0.5px solid #d3d1c7;border-radius:12px;padding:32px 36px;width:300px;text-align:center;">
    <p style="font-size:15px;font-weight:500;color:#2C2C2A;margin-bottom:6px;">Roots map</p>
    <p style="font-size:13px;color:#888780;margin-bottom:20px;">Enter the class password to continue</p>
    <input id="pw" type="password" placeholder="Password" autofocus
      style="width:100%;padding:8px 12px;font-size:14px;border:0.5px solid #d3d1c7;border-radius:8px;outline:none;margin-bottom:10px;"/>
    <div id="pw-error" style="font-size:12px;color:#A32D2D;min-height:16px;margin-bottom:8px;"></div>
    <button onclick="checkPassword()"
      style="width:100%;padding:9px;font-size:14px;background:#534AB7;color:white;border:none;border-radius:8px;cursor:pointer;">
      Enter
    </button>
  </div>
</div>

<script>
document.getElementById('pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPassword();
});
function checkPassword() {
  const val = document.getElementById('pw').value;
  if (val === 'Mus26') {
    document.getElementById('gate').style.display = 'none';
  } else {
    document.getElementById('pw-error').textContent = 'Incorrect password.';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}
</script>

<div id="header">
  <h1>Roots map</h1>
  <p>Student birthplaces and caretaker origins — hover any pin for details</p>
</div>

<div style="position:relative;">

    <div class="legend-row"><div style="width:7px;height:7px;border-radius:50%;background:#1D9E75;flex-shrink:0;"></div> Parent / caretaker (gen 1)</div>
    <div class="legend-row"><div style="width:7px;height:7px;border-radius:50%;background:#D85A30;flex-shrink:0;"></div> Grandparent (gen 2)</div>
    <div class="legend-row"><div style="width:7px;height:7px;border-radius:50%;background:#888780;flex-shrink:0;"></div> Other (gen 3+)</div>
  </div>
</div>

const S_COLOR   = '#534AB7';
const C_COLORS  = { 1: '#1D9E75', 2: '#D85A30', 3: '#888780' };
const L_WEIGHT  = { 1: 2.5,  2: 1.2,  3: 0.7 };
const L_OPACITY = { 1: 0.65, 2: 0.45, 3: 0.3 };
const L_DASH    = { 1: null, 2: '5 4', 3: '2 4' };
const ROUND     = 3;

function key(lat, lng) {
  return lat.toFixed(ROUND) + ',' + lng.toFixed(ROUND);
}

const map = L.map('map', { zoomControl: true, scrollWheelZoom: true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://carto.com/">CartoDB</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

function makeMarker(lat, lng, color, size, tipHtml) {
  const icon = L.divIcon({
    html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:1.5px solid white;outline:1px solid ${color};cursor:pointer;"></div>`,
    iconSize: [size, size], iconAnchor: [size/2, size/2], className: ''
  });
  return L.marker([lat, lng], { icon })
    .bindTooltip(tipHtml, { permanent: false, direction: 'top', className: 'rt', offset: [0, -6] });
}

// Group students by location so overlapping pins share one marker
const studentsByLoc = {};
STUDENTS.forEach(s => {
  if (s.lat == null || s.lng == null) return;
  const k = key(s.lat, s.lng);
  if (!studentsByLoc[k]) studentsByLoc[k] = { lat: s.lat, lng: s.lng, students: [] };
  studentsByLoc[k].students.push(s.name);
});

// Group caretaker dots by location too
const caretakersByLoc = {};
STUDENTS.forEach(s => {
  s.caretakers.forEach(c => {
    if (!c.lat || !c.lng) return;
    const k = key(c.lat, c.lng);
    if (!caretakersByLoc[k]) caretakersByLoc[k] = { lat: c.lat, lng: c.lng, city: c.city, gen: c.gen };
    // keep lowest gen (closest generation) for color
    if (c.gen < caretakersByLoc[k].gen) caretakersByLoc[k].gen = c.gen;
  });
});

const allBounds = [];

// Draw lines first so they sit under markers
STUDENTS.forEach(s => {
  if (s.lat == null || s.lng == null) return;
  const drawn = new Set();
  s.caretakers.forEach(c => {
    if (!c.lat || !c.lng) return;
    const ck = key(c.lat, c.lng);
    if (drawn.has(ck)) return;
    drawn.add(ck);
    const gen = Math.min(c.gen || 1, 3);
    L.polyline([[s.lat, s.lng], [c.lat, c.lng]], {
      color: C_COLORS[gen],
      weight: L_WEIGHT[gen],
      opacity: L_OPACITY[gen],
      dashArray: L_DASH[gen]
    }).addTo(map);
  });
});

// Draw caretaker dots
Object.values(caretakersByLoc).forEach(c => {
  const gen = Math.min(c.gen || 1, 3);
  makeMarker(c.lat, c.lng, C_COLORS[gen], 7, c.city).addTo(map);
  allBounds.push([c.lat, c.lng]);
});

// Draw student dots — grouped tooltip if multiple share a location
Object.values(studentsByLoc).forEach(loc => {
  let tipHtml;
  if (loc.students.length === 1) {
    tipHtml = `<span class="rt-name">${loc.students[0]}</span>`;
  } else {
    tipHtml = loc.students.map((n, i) =>
      (i > 0 ? '<hr class="rt-divider">' : '') + `<span class="rt-name">${n}</span>`
    ).join('');
  }
  makeMarker(loc.lat, loc.lng, S_COLOR, 10, tipHtml).addTo(map);
  allBounds.push([loc.lat, loc.lng]);
});

if (allBounds.length) map.fitBounds(allBounds, { padding: [40, 40] });
</script>
