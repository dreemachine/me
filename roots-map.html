<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f7f4; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
#header { padding: 14px 20px; background: white; border-bottom: 0.5px solid #d3d1c7; flex-shrink: 0; }
#header h1 { font-size: 17px; font-weight: 500; color: #2C2C2A; }
#header p  { font-size: 12px; color: #888780; margin-top: 2px; }
#body { display: flex; flex: 1; overflow: hidden; }
#sidebar {
  width: 230px; flex-shrink: 0; background: white;
  border-right: 0.5px solid #d3d1c7; overflow-y: auto;
  padding: 10px 0;
}
#sidebar-title { font-size: 11px; font-weight: 500; color: #888780; text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 16px 8px; }
.s-item {
  padding: 7px 16px; font-size: 13px; color: #444441; cursor: pointer;
  border-left: 3px solid transparent; transition: background 0.1s;
  line-height: 1.35;
}
.s-item:hover { background: #f1efe8; }
.s-item.active { background: #eeedfe; border-left-color: #534AB7; color: #3C3489; font-weight: 500; }
#map-wrap { flex: 1; position: relative; }
#map { height: 100%; width: 100%; }
#legend {
  position: absolute; bottom: 20px; right: 16px; z-index: 1000;
  background: white; border: 0.5px solid #d3d1c7; border-radius: 10px;
  padding: 10px 14px; max-height: 50vh; overflow-y: auto;
}
.leg-row { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #5F5E5A; padding: 2px 0; }
.leg-swatch { width: 22px; height: 3px; border-radius: 2px; flex-shrink: 0; }
.leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.leaflet-tooltip.rt {
  background: white; border: 0.5px solid #d3d1c7; border-radius: 6px;
  padding: 5px 10px; font-size: 12px; color: #2C2C2A; line-height: 1.6;
  box-shadow: none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.leaflet-tooltip.rt::before { display: none; }
.rt-name { font-weight: 500; display: block; }
.rt-divider { border: none; border-top: 0.5px solid #d3d1c7; margin: 3px 0; }
@keyframes pulse-ring {
  0%   { transform: translate(-50%,-50%) scale(1);   opacity: 0.6; }
  100% { transform: translate(-50%,-50%) scale(2.6); opacity: 0; }
}
#gate {
  position: fixed; inset: 0; background: #f8f7f4; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
}
#gate-box {
  background: white; border: 0.5px solid #d3d1c7; border-radius: 12px;
  padding: 32px 36px; width: 300px; text-align: center;
}
</style>
</head>

<div id="gate">

    <p style="font-size:15px;font-weight:500;color:#2C2C2A;margin-bottom:6px;">Roots map</p>

</div>

<script>
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });
function checkPassword() {
  if (document.getElementById('pw').value === 'Mus26') {
    document.getElementById('gate').style.display = 'none';
    initMap();
  } else {
    document.getElementById('pw-error').textContent = 'Incorrect password.';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}

// Country detection from city string
function getCountry(city) {
  const c = city.toLowerCase();
  if (/vietnam|viet/.test(c)) return 'Vietnam';
  if (/china|beijing|shanghai|shandong|hebei|jiangxi|tianjin|shenyang|hangzhou|ningbo|huainan|chaoyang|beilun/.test(c)) return 'China';
  if (/korea|seoul/.test(c)) return 'Korea';
  if (/japan|tokyo|sendai|ishinomaki|osaka|kyoto/.test(c)) return 'Japan';
  if (/taiwan|taipei|chiayi/.test(c)) return 'Taiwan';
  if (/hong kong/.test(c)) return 'Hong Kong';
  if (/india|bihar|ahmedabad|sajiyavadar/.test(c)) return 'India';
  if (/mexico|oaxaca|guanajuato|toluca|manuel doblado/.test(c)) return 'Mexico';
  if (/guatemala/.test(c)) return 'Guatemala';
  if (/puerto rico|añasco|san juan/.test(c)) return 'Puerto Rico';
  if (/nigeria|imo|aba/.test(c)) return 'Nigeria';
  if (/zambia|lusaka/.test(c)) return 'Zambia';
  if (/mozambique|maputo/.test(c)) return 'Mozambique';
  if (/armenia|eshmianse|hoctoberianse/.test(c)) return 'Armenia';
  if (/norway|oslo/.test(c)) return 'Norway';
  if (/germany|munich/.test(c)) return 'Germany';
  return 'North America';
}

// Per-country colors — visually distinct, not grouped by region
const COUNTRY_COLORS = {
  'Vietnam':      '#e05c3a',
  'China':        '#c9395e',
  'Korea':        '#a855b5',
  'Japan':        '#7c3aed',
  'Taiwan':       '#4f6ddb',
  'Hong Kong':    '#2563b8',
  'India':        '#0891b2',
  'Mexico':       '#059669',
  'Guatemala':    '#65a30d',
  'Puerto Rico':  '#ca8a04',
  'Nigeria':      '#d97706',
  'Zambia':       '#dc4f1a',
  'Mozambique':   '#be185d',
  'Armenia':      '#7e22ce',
  'Norway':       '#1d6fb5',
  'Germany':      '#374151',
  'North America':'#9ca3af',
};

const DIM_OPACITY    = 0.08;
const ACTIVE_OPACITY = 0.85;
const S_COLOR        = '#534AB7';
const ROUND          = 3;

function key(lat, lng) { return lat.toFixed(ROUND) + ',' + lng.toFixed(ROUND); }

function initMap() {
  const map = L.map('map', { zoomControl: true, scrollWheelZoom: true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://carto.com/">CartoDB</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);

  function makeDot(lat, lng, color, size, tipHtml, isStudent) {
    const icon = L.divIcon({
      html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:1.5px solid white;outline:1px solid ${color};cursor:pointer;position:relative;">
        ${isStudent ? `<div class="pulse-ring" style="display:none;position:absolute;top:50%;left:50%;width:${size}px;height:${size}px;border-radius:50%;background:${color};animation:pulse-ring 1.2s ease-out infinite;"></div>` : ''}
      </div>`,
      iconSize: [size,size], iconAnchor: [size/2,size/2], className:''
    });
    return L.marker([lat,lng],{icon}).bindTooltip(tipHtml,{permanent:false,direction:'top',className:'rt',offset:[0,-6]});
  }

  function setMarkerActive(marker, active, color) {
    if (!marker) return;
    const el = marker.getElement();
    if (!el) return;
    const dot = el.querySelector('div');
    const ring = el.querySelector('.pulse-ring');
    if (active) {
      dot.style.width  = '15px';
      dot.style.height = '15px';
      dot.style.outline = `2px solid ${color}`;
      dot.style.boxShadow = `0 0 0 3px ${color}44`;
      marker.setIcon(L.divIcon({
        html: `<div style="width:15px;height:15px;border-radius:50%;background:${color};border:2px solid white;outline:2px solid ${color};box-shadow:0 0 0 4px ${color}33;cursor:pointer;position:relative;">
          <div class="pulse-ring" style="position:absolute;top:50%;left:50%;width:15px;height:15px;border-radius:50%;background:${color};animation:pulse-ring 1.2s ease-out infinite;"></div>
        </div>`,
        iconSize:[15,15], iconAnchor:[7.5,7.5], className:''
      }));
    } else {
      marker.setIcon(L.divIcon({
        html: `<div style="width:10px;height:10px;border-radius:50%;background:${color};border:1.5px solid white;outline:1px solid ${color};cursor:pointer;"></div>`,
        iconSize:[10,10], iconAnchor:[5,5], className:''
      }));
    }
  }

  // Build per-student line + dot layers
  const studentLayers = {}; // name -> { lines: [], dots: [] }
  const allLines = [];

  STUDENTS.forEach(s => {
    const layers = { lines: [], dots: [] };
    studentLayers[s.name] = layers;

    if (s.lat == null || s.lng == null) return;

    const drawnLines = new Set();
    s.caretakers.forEach(c => {
      if (!c.lat || !c.lng) return;
      const ck = key(c.lat, c.lng);
      if (drawnLines.has(ck)) return;
      drawnLines.add(ck);
      const country = getCountry(c.city);
      const color = COUNTRY_COLORS[country] || '#9ca3af';
      const line = L.polyline([[s.lat,s.lng],[c.lat,c.lng]], {
        color, weight: 2, opacity: DIM_OPACITY
      }).addTo(map);
      layers.lines.push(line);
      allLines.push(line);
    });
  });

  // Group student markers by location
  const studentsByLoc = {};
  STUDENTS.forEach(s => {
    if (s.lat == null || s.lng == null) return;
    const k = key(s.lat, s.lng);
    if (!studentsByLoc[k]) studentsByLoc[k] = { lat: s.lat, lng: s.lng, names: [] };
    studentsByLoc[k].names.push(s.name);
  });

  // Draw caretaker dots
  const caretakersByLoc = {};
  STUDENTS.forEach(s => {
    s.caretakers.forEach(c => {
      if (!c.lat || !c.lng) return;
      const k = key(c.lat, c.lng);
      if (!caretakersByLoc[k]) caretakersByLoc[k] = { lat: c.lat, lng: c.lng, city: c.city };
    });
  });
  Object.values(caretakersByLoc).forEach(c => {
    const country = getCountry(c.city);
    const color = COUNTRY_COLORS[country] || '#9ca3af';
    makeDot(c.lat, c.lng, color, 7, c.city, false).addTo(map);
  });

  // Draw student dots
  const studentMarkers = {};
  Object.values(studentsByLoc).forEach(loc => {
    const tipHtml = loc.names.length === 1
      ? `<span class="rt-name">${loc.names[0]}</span>`
      : loc.names.map((n,i) => (i>0?'<hr class="rt-divider">':'')+`<span class="rt-name">${n}</span>`).join('');
    const m = makeDot(loc.lat, loc.lng, S_COLOR, 10, tipHtml, true).addTo(map);
    loc.names.forEach(n => { studentMarkers[n] = m; });
  });

  const allBounds = [
    ...Object.values(studentsByLoc).map(l => [l.lat, l.lng]),
    ...Object.values(caretakersByLoc).map(c => [c.lat, c.lng])
  ];
  if (allBounds.length) map.fitBounds(allBounds, { padding: [40, 40] });

  // Sidebar
  let activeStudent = null;
  const list = document.getElementById('student-list');

  STUDENTS.slice().sort((a,b) => a.name.localeCompare(b.name)).forEach(s => {
    const el = document.createElement('div');
    el.className = 's-item';
    el.textContent = s.name;
    el.dataset.name = s.name;
    el.addEventListener('click', () => {
      const marker = studentMarkers[s.name];
      if (activeStudent === s.name) {
        activeStudent = null;
        el.classList.remove('active');
        allLines.forEach(l => l.setStyle({ opacity: DIM_OPACITY, weight: 2 }));
        setMarkerActive(marker, false, S_COLOR);
      } else {
        // deactivate previous
        if (activeStudent && studentMarkers[activeStudent]) {
          setMarkerActive(studentMarkers[activeStudent], false, S_COLOR);
        }
        document.querySelectorAll('.s-item').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        activeStudent = s.name;
        allLines.forEach(l => l.setStyle({ opacity: DIM_OPACITY, weight: 2 }));
        (studentLayers[s.name]?.lines || []).forEach(l => l.setStyle({ opacity: ACTIVE_OPACITY, weight: 3 }));
        setMarkerActive(marker, true, S_COLOR);
        if (s.lat != null) map.setView([s.lat, s.lng], 3, { animate: true });
      }
    });
    list.appendChild(el);
  });

  // Legend
  const legendRows = document.getElementById('legend-rows');
  Object.entries(COUNTRY_COLORS).forEach(([country, color]) => {
    const row = document.createElement('div');
    row.className = 'leg-row';
    row.innerHTML = `<div class="leg-swatch" style="background:${color};"></div>${country}`;
    legendRows.appendChild(row);
  });
}
</script>
</body>
</html>
