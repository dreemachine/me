function getCountry(city) {
  var c = city.toLowerCase();
  if (/vietnam|viet|bac lieu|mien trung|saigon/.test(c)) return 'Vietnam';
  if (/china|beijing|shanghai|shandong|hebei|jiangxi|tianjin|shenyang|hangzhou|ningbo|huainan|chaoyang|beilun/.test(c)) return 'China';
  if (/korea|seoul/.test(c)) return 'Korea';
  if (/japan|tokyo|sendai|ishinomaki/.test(c)) return 'Japan';
  if (/taiwan|taipei|chiayi/.test(c)) return 'Taiwan';
  if (/hong kong/.test(c)) return 'Hong Kong';
  if (/india|bihar|ahmedabad|sajiyavadar/.test(c)) return 'India';
  if (/mexico|oaxaca|guanajuato|toluca|manuel doblado/.test(c)) return 'Mexico';
  if (/guatemala/.test(c)) return 'Guatemala';
  if (/puerto rico|a\u00f1asco/.test(c)) return 'Puerto Rico';
  if (/nigeria|imo|aba/.test(c)) return 'Nigeria';
  if (/zambia|lusaka/.test(c)) return 'Zambia';
  if (/mozambique|maputo|quelimane/.test(c)) return 'Mozambique';
  if (/armenia|ejmiatsin|armavir/.test(c)) return 'Armenia';
  if (/norway|oslo/.test(c)) return 'Norway';
  if (/germany|munich/.test(c)) return 'Germany';
  if (/hawaii|honolulu|oahu/.test(c)) return 'Hawaii / USA';
  return 'North America';
}

var COUNTRY_COLORS = {
  'Vietnam':'#e05c3a','China':'#c9395e','Korea':'#a855b5','Japan':'#7c3aed',
  'Taiwan':'#4f6ddb','Hong Kong':'#2563b8','India':'#0891b2','Mexico':'#059669',
  'Guatemala':'#65a30d','Puerto Rico':'#ca8a04','Nigeria':'#d97706','Zambia':'#dc4f1a',
  'Mozambique':'#be185d','Armenia':'#7e22ce','Norway':'#1d6fb5','Germany':'#94a3b8',
  'Hawaii / USA':'#0d9488','North America':'#6b7280'
};

function initGlobe() {
  var wrap  = document.getElementById('globe-wrap');
  var W     = wrap.clientWidth;
  var H     = wrap.clientHeight;
  var R     = Math.min(W, H) * 0.42;
  var canvas = document.getElementById('globe');
  canvas.width  = W;
  canvas.height = H;
  var ctx   = canvas.getContext('2d');
  var tooltip = document.getElementById('tooltip');

  var rotate   = [-100, -30, 0];
  var scale    = R;

  function projection() {
    return d3.geoOrthographic()
      .scale(scale)
      .translate([W/2, H/2])
      .clipAngle(90)
      .rotate(rotate);
  }

  // Build arc data
  var arcData = [];
  var countryArcs  = {};
  var studentArcs  = {};

  STUDENTS.forEach(function(s) {
    if (s.lat == null) return;
    studentArcs[s.name] = [];
    var drawn = {};
    s.caretakers.forEach(function(c) {
      if (!c.lat || !c.lng) return;
      var ck = c.lat.toFixed(3)+','+c.lng.toFixed(3);
      if (drawn[ck]) return;
      drawn[ck] = true;
      var country = getCountry(c.city);
      var color   = COUNTRY_COLORS[country] || '#6b7280';
      var arc = {
        geo: { type:'LineString', coordinates:[[s.lng,s.lat],[c.lng,c.lat]] },
        color: color, country: country,
        studentName: s.name, caretakerCity: c.city,
        sLat: s.lat, sLng: s.lng, cLat: c.lat, cLng: c.lng
      };
      arcData.push(arc);
      studentArcs[s.name].push(arc);
      if (!countryArcs[country]) countryArcs[country] = [];
      countryArcs[country].push(arc);
    });
  });

  // Pre-compute same-origin rings per participant
  var participantRings = {}; // name -> [colors]
  var arcDupCount = {};      // arc key -> count (for x2 badge)

  STUDENTS.forEach(function(s) {
    if (s.lat == null) return;
    var sk = s.lat.toFixed(3)+','+s.lng.toFixed(3);
    participantRings[s.name] = [];
    var cityCount = {};
    s.caretakers.forEach(function(c) {
      if (!c.lat || !c.lng) return;
      var ck = c.lat.toFixed(3)+','+c.lng.toFixed(3);
      cityCount[ck] = (cityCount[ck]||0) + 1;
      if (ck === sk) {
        var country = getCountry(c.city);
        var color = COUNTRY_COLORS[country] || '#6b7280';
        participantRings[s.name].push(color);
      }
    });
    // store dup counts on arcs
    Object.keys(cityCount).forEach(function(ck) {
      var key = s.name+'|'+ck;
      arcDupCount[key] = cityCount[ck];
    });
  });

  // State
  var activeStudent = null;
  var activeCountry = null;
  var land = null;

  function hexToRgba(hex, alpha) {
    var r = parseInt(hex.slice(1,3),16);
    var g = parseInt(hex.slice(3,5),16);
    var b = parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+alpha+')';
  }

  function draw() {
    var proj = projection();
    var pathGen = d3.geoPath().projection(proj).context(ctx);

    ctx.clearRect(0, 0, W, H);

    // Ocean
    ctx.beginPath();
    pathGen({type:'Sphere'});
    var grad = ctx.createRadialGradient(W/2-R*0.2, H/2-R*0.2, R*0.1, W/2, H/2, R);
    grad.addColorStop(0, '#1e1e30');
    grad.addColorStop(1, '#0a0a14');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#2a2a40';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Graticule
    ctx.beginPath();
    pathGen(d3.geoGraticule()());
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Land
    if (land) {
      ctx.beginPath();
      pathGen(land);
      ctx.fillStyle = '#1e2235';
      ctx.fill();
      ctx.strokeStyle = '#2d3050';
      ctx.lineWidth = 0.4;
      ctx.stroke();
    }

    // Arcs
    arcData.forEach(function(arc) {
      var isActive = (activeStudent && arc.studentName === activeStudent) ||
                     (activeCountry && arc.country === activeCountry);
      var dim = activeStudent || activeCountry;
      var opacity = dim ? (isActive ? 0.9 : 0.03) : 0.15;
      var width   = isActive ? 2 : 1;
      ctx.beginPath();
      pathGen(arc.geo);
      ctx.strokeStyle = hexToRgba(arc.color, opacity);
      ctx.lineWidth = width;
      ctx.stroke();
    });

    // Dots — caretakers first, students on top
    var proj2 = projection();
    function drawDot(lng, lat, color, r) {
      var p = proj2([lng, lat]);
      if (!p) return;
      // check if on visible hemisphere
      var gp = d3.geoOrthographic().scale(scale).translate([W/2,H/2]).clipAngle(90).rotate(rotate);
      var visible = d3.geoContains({type:'Sphere'}, [lng, lat]);
      // use clipAngle check via path
      ctx.beginPath();
      ctx.arc(p[0], p[1], r, 0, 2*Math.PI);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#0e0e12';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    var projFn = d3.geoOrthographic().scale(scale).translate([W/2,H/2]).clipAngle(90).rotate(rotate);
    var clipPath = d3.geoPath().projection(projFn);

    arcData.forEach(function(arc) {
      var p = projFn([arc.cLng, arc.cLat]);
      if (!p) return;
      var country = arc.country;
      var color = COUNTRY_COLORS[country] || '#6b7280';
      ctx.beginPath();
      ctx.arc(p[0], p[1], 3, 0, 2*Math.PI);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#0e0e12';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    });

    STUDENTS.forEach(function(s) {
      if (s.lat == null) return;
      var p = projFn([s.lng, s.lat]);
      if (!p) return;
      var rings = participantRings[s.name] || [];
      var uniqueRings = [];
      rings.forEach(function(r){ if (uniqueRings.indexOf(r)===-1) uniqueRings.push(r); });
      uniqueRings = uniqueRings.slice(0,2);
      // draw rings outward first
      uniqueRings.forEach(function(rc, i) {
        var rr = 4 + (i===0 ? 7 : 13);
        ctx.beginPath();
        ctx.arc(p[0], p[1], rr, 0, 2*Math.PI);
        ctx.strokeStyle = rc;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.7;
        ctx.stroke();
        ctx.globalAlpha = 1;
      });
      // participant dot
      ctx.beginPath();
      ctx.arc(p[0], p[1], 4, 0, 2*Math.PI);
      ctx.fillStyle = '#7c6fcd';
      ctx.fill();
      ctx.strokeStyle = '#0e0e12';
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    // x2 badges — only when a participant or country is active
    if (activeStudent || activeCountry) {
      arcData.forEach(function(arc) {
        var isActive = (activeStudent && arc.studentName === activeStudent) ||
                       (activeCountry && arc.country === activeCountry);
        if (!isActive) return;
        var key = arc.studentName+'|'+arc.cLat.toFixed(3)+','+arc.cLng.toFixed(3);
        var count = arcDupCount[key] || 1;
        if (count < 2) return;
        // true great-circle midpoint via interpolation
        var interp = d3.geoInterpolate([arc.sLng, arc.sLat], [arc.cLng, arc.cLat]);
        var mid = interp(0.5);
        var mp = projFn(mid);
        if (!mp) return;
        var label = '×' + count;
        var br = 14;
        ctx.beginPath();
        ctx.arc(mp[0], mp[1], br, 0, 2*Math.PI);
        ctx.fillStyle = arc.color;
        ctx.fill();
        ctx.font = 'bold 13px -apple-system, sans-serif';
        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, mp[0], mp[1]);
      });
    }
  }

  // Load land data
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json').then(function(world) {
    land = topojson.feature(world, world.objects.land);
    draw();
  });

  draw();

  // Mouse drag to rotate
  var dragging = false;
  var lastX, lastY;

  canvas.addEventListener('mousedown', function(e) {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.classList.add('dragging');
  });
  window.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var dx = e.clientX - lastX;
    var dy = e.clientY - lastY;
    rotate[0] += dx * 0.3;
    rotate[1] -= dy * 0.3;
    rotate[1] = Math.max(-90, Math.min(90, rotate[1]));
    lastX = e.clientX;
    lastY = e.clientY;
    draw();
  });
  window.addEventListener('mouseup', function() {
    dragging = false;
    canvas.classList.remove('dragging');
  });

  // Touch drag
  var lastTX, lastTY;
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    lastTX = e.touches[0].clientX;
    lastTY = e.touches[0].clientY;
  }, {passive:false});
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var dx = e.touches[0].clientX - lastTX;
    var dy = e.touches[0].clientY - lastTY;
    rotate[0] += dx * 0.3;
    rotate[1] -= dy * 0.3;
    rotate[1] = Math.max(-90, Math.min(90, rotate[1]));
    lastTX = e.touches[0].clientX;
    lastTY = e.touches[0].clientY;
    draw();
  }, {passive:false});

  // Scroll to zoom
  canvas.addEventListener('wheel', function(e) {
    e.preventDefault();
    scale = Math.max(80, Math.min(1400, scale - e.deltaY * 0.5));
    draw();
  }, {passive:false});

  // Tooltip on hover
  canvas.addEventListener('mousemove', function(e) {
    if (dragging) { tooltip.style.display = 'none'; return; }
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;
    var projFn = d3.geoOrthographic().scale(scale).translate([W/2,H/2]).clipAngle(90).rotate(rotate);
    var found = null;
    // check students first
    STUDENTS.forEach(function(s) {
      if (s.lat == null) return;
      var p = projFn([s.lng, s.lat]);
      if (!p) return;
      if (Math.hypot(p[0]-mx, p[1]-my) < 8) found = s.name;
    });
    if (!found) {
      arcData.forEach(function(arc) {
        var p = projFn([arc.cLng, arc.cLat]);
        if (!p) return;
        if (Math.hypot(p[0]-mx, p[1]-my) < 6) found = arc.caretakerCity;
      });
    }
    if (found) {
      tooltip.style.display = 'block';
      tooltip.style.left = (mx + 14) + 'px';
      tooltip.style.top  = (my - 8)  + 'px';
      tooltip.textContent = found;
    } else {
      tooltip.style.display = 'none';
    }
  });

  canvas.addEventListener('mouseleave', function() { tooltip.style.display = 'none'; });

  // Sidebar
  var list = document.getElementById('student-list');
  STUDENTS.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).forEach(function(s) {
    var el = document.createElement('div');
    el.className = 's-item';
    el.textContent = s.name;
    el.addEventListener('click', function() {
      if (activeStudent === s.name) {
        activeStudent = null;
        el.classList.remove('active');
      } else {
        activeStudent = s.name;
        activeCountry = null;
        document.querySelectorAll('.s-item').forEach(function(e){ e.classList.remove('active'); });
        document.querySelectorAll('.leg-row').forEach(function(e){ e.classList.remove('active'); });
        el.classList.add('active');
        if (s.lat != null) {
          // animate rotate to student
          var startRotate = rotate.slice();
          var endRotate = [-s.lng, -s.lat, 0];
          var t = 0;
          var anim = setInterval(function() {
            t += 0.05;
            if (t >= 1) { t = 1; clearInterval(anim); }
            rotate[0] = startRotate[0] + (endRotate[0] - startRotate[0]) * t;
            rotate[1] = startRotate[1] + (endRotate[1] - startRotate[1]) * t;
            draw();
          }, 16);
        }
      }
      draw();
    });
    list.appendChild(el);
  });

  // Legend
  var legendRows = document.getElementById('legend-rows');
  Object.keys(COUNTRY_COLORS).forEach(function(country) {
    if (!countryArcs[country]) return;
    var color = COUNTRY_COLORS[country];
    var row = document.createElement('div');
    row.className = 'leg-row';
    row.innerHTML = '<div class="leg-swatch" style="background:'+color+';"></div>'+country;
    row.addEventListener('click', function() {
      if (activeCountry === country) {
        activeCountry = null;
        row.classList.remove('active');
      } else {
        activeCountry = country;
        activeStudent = null;
        document.querySelectorAll('.s-item').forEach(function(e){ e.classList.remove('active'); });
        document.querySelectorAll('.leg-row').forEach(function(e){ e.classList.remove('active'); });
        row.classList.add('active');
      }
      draw();
    });
    legendRows.appendChild(row);
  });
}
</script>
</body>
</html>
